<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">MIATSUNO — Kaye Bird</title>
  <desc id="desc">Banner de Kaye Bird, também conhecida como Miatsuno, com sinais luminosos, referências à escrita, música, Kayepad e Kachey.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cffcb" />
      <stop offset="1" stop-color="#d7ff5f" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7df" />
      <stop offset="1" stop-color="#d6cba7" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)" />
  <g fill="none" stroke="#263244" stroke-width="1" opacity=".6">
    <path d="M0 52H1200M0 104H1200M0 156H1200M0 208H1200" />
    <path d="M80 0V260M200 0V260M320 0V260M440 0V260M560 0V260M680 0V260M800 0V260M920 0V260M1040 0V260M1160 0V260" />
  </g>
  <g opacity=".94">
    <path d="M72 48 165 32 202 50 202 209 111 225 72 205Z" fill="#151e2a" stroke="#5a6a79" stroke-width="2" />
    <path d="M83 54 158 41 188 54 188 194 113 207 83 195Z" fill="url(#paper)" />
    <path d="M136 45V201" stroke="#b7a985" stroke-width="2" />
    <path d="M96 82 126 77M96 101 126 96M96 120 126 115M96 139 126 134M148 78 176 73M148 97 176 92M148 116 176 111M148 135 176 130" stroke="#7d856d" stroke-width="2" opacity=".62" />
    <path d="M108 222 177 211 199 226 132 241Z" fill="#111827" stroke="#7cffcb" stroke-width="1.5" />
    <path d="M128 234 188 223" stroke="#d7ff5f" stroke-width="2" />
  </g>
  <path d="M0 182 C150 182 150 72 300 72 S450 182 600 182 S750 72 900 72 S1050 182 1200 182" fill="none" stroke="#7cffcb" stroke-width="2" opacity=".25" />
  <path d="M185 182 C300 182 330 80 430 80 S530 182 640 182 S750 80 860 80 S970 182 1120 182" fill="none" stroke="url(#signal)" stroke-width="3" stroke-dasharray="18 22" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3s" repeatCount="indefinite" />
  </path>
  <g fill="none" stroke="#51e6cb" stroke-width="2" opacity=".46">
    <path d="M865 43h42v18h28v18h35" />
    <path d="M1003 179h34v-20h33v-18h54" />
    <path d="M884 219h46v-16h28v-17h36" />
    <path d="M1050 57h25v19h37v17h48" />
