<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">MIATSUNO — building in the web</title>
  <desc id="desc">An animated dark banner with a green signal and the words MIATSUNO.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cffcb" />
      <stop offset="1" stop-color="#d7ff5f" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="240" rx="18" fill="url(#bg)" />
  <g fill="none" stroke="#263244" stroke-width="1" opacity=".65">
    <path d="M0 48H1200M0 96H1200M0 144H1200M0 192H1200" />
    <path d="M80 0V240M200 0V240M320 0V240M440 0V240M560 0V240M680 0V240M800 0V240M920 0V240M1040 0V240M1160 0V240" />
  </g>
  <path d="M0 178 C150 178 150 62 300 62 S450 178 600 178 S750 62 900 62 S1050 178 1200 178" fill="none" stroke="#7cffcb" stroke-width="2" opacity=".35" />
  <path d="M0 178 C150 178 150 62 300 62 S450 178 600 178 S750 62 900 62 S1050 178 1200 178" fill="none" stroke="url(#signal)" stroke-width="3" stroke-dasharray="18 22" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3s" repeatCount="indefinite" />
  </path>
  <g filter="url(#glow)" fill="#d7ff5f">
    <circle cx="300" cy="62" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="600" cy="178" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="900" cy="62" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" begin=".7s" repeatCount="indefinite" /></circle>
  </g>
  <text x="600" y="112" text-anchor="middle" fill="#f4f7fb" font-family="monospace" font-size="58" font-weight="700" letter-spacing="12">MIATSUNO</text>
  <text x="600" y="145" text-anchor="middle" fill="#9aa9bd" font-family="monospace" font-size="14" letter-spacing="5">BUILDING IN THE WEB</text>
</svg>
